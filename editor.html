<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - Creative Animation</title>
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <div class="editor-container">
        <aside class="toolbar-panel">
            <div class="tool-section">
                <h3>Modo de Animación</h3>
                <div class="mode-selector">
                    <button class="mode-btn selected" data-mode="draw">Por Dibujo</button>
                    <button class="mode-btn" data-mode="parts">Por Partes</button>
                    <button class="mode-btn" data-mode="bone" disabled>Por Hueso</button>
                </div>
            </div>
            <div class="tool-section">
                <h3>Herramientas</h3>
                <div class="tools">
                    <button class="tool-btn selected" data-tool="brush">Pincel</button>
                    <button class="tool-btn" data-tool="marker">Marcador</button>
                    <button class="tool-btn" data-tool="pencil">Lápiz</button>
                    <button class="tool-btn" data-tool="eraser">Borrador</button>
                    <button class="tool-btn" data-tool="lasso" style="display: none;">Lazo</button>
                </div>
            </div>
            <div class="tool-section">
                <h3>Propiedades</h3>
                <div class="tool-property">
                    <label for="brush-size">Grosor: <span id="brush-size-value">2</span></label>
                    <input type="range" id="brush-size" min="1" max="100" value="2">
                </div>
                <div class="tool-property">
                    <label for="brush-opacity">Opacidad: <span id="brush-opacity-value">1.0</span></label>
                    <input type="range" id="brush-opacity" min="0.1" max="1" step="0.1" value="1">
                </div>
            </div>
            <div class="tool-section">
                <h3>Color</h3>
                <input type="color" id="color-picker" value="#000000">
                <div class="saved-colors">
                    <h4>Paleta</h4>
                    <div class="colors-bubble">
                        <div id="saved-colors-grid"></div>
                        <button id="save-color-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="tool-section" id="parts-panel" style="display: none;">
                <h3>Partes del Dibujo</h3>
                <div class="parts-grid-container">
                    <div id="parts-grid"></div>
                </div>
                <button id="save-part-btn">Guardar Parte</button>
            </div>
            <div class="tool-section">
                <h3>Lienzo</h3>
                <button id="set-size-btn">Definir Tamaño</button>
            </div>
            <div class="tool-section">
                <h3>Efecto Cebolla</h3>
                <div class="onion-skin-controls">
                    <label>
                        <input type="checkbox" id="onion-skin-guide"> Guía
                    </label>
                    <label>
                        <input type="checkbox" id="onion-skin-copy"> Copiar y Borrar
                    </label>
                </div>
            </div>
        </aside>
        <main class="canvas-container">
            <div class="canvas-wrapper">
                <canvas id="onion-skin-canvas"></canvas>
                <canvas id="main-canvas"></canvas>
                <canvas id="guide-canvas"></canvas>
            </div>
        </main>

        <!-- Modal para Definir Tamaño -->
        <div id="size-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <h3>Definir Tamaño del Fotograma</h3>
                <p>Introduce las dimensiones en píxeles.</p>
                <div class="modal-inputs">
                    <label for="frame-width">Ancho:</label>
                    <input type="number" id="frame-width" value="32" min="1">
                    <label for="frame-height">Alto:</label>
                    <input type="number" id="frame-height" value="32" min="1">
                </div>
                <div class="modal-actions">
                    <button id="save-size-btn">Guardar</button>
                    <button id="cancel-size-btn">Cancelar</button>
                </div>
            </div>
        </div>

        <footer class="timeline-panel">
            <button id="toggle-timeline-btn" class="timeline-toggle">▼</button>
            <div class="timeline-controls">
                <button id="add-frame-btn">Añadir Fotograma</button>
            </div>
            <div class="frames-strip">
                <!-- Las previsualizaciones de los fotogramas irán aquí -->
            </div>
        </footer>
    </div>
    <script src="db.js"></script>
    <script src="editor.js"></script>
</body>
</html>
